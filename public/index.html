<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FastMedia</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            background: #121212; 
            color: #e0e0e0; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            padding: 15px; 
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h2 { width: 100%; max-width: 800px; border-bottom: 1px solid #333; padding-bottom: 10px; margin-top: 10px; }
        #contenedor-videos { width: 100%; max-width: 800px; }
        
        .video-card { 
            background: #1e1e1e; 
            padding: 15px; 
            margin-bottom: 20px; 
            border-radius: 8px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        
        /* Acortar textos largos inteligentemente */
        .video-card h3 { 
            margin: 0 0 10px 0; 
            font-size: 16px; 
            font-weight: normal;
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis; 
            color: #bb86fc;
        }
        
        video { 
            width: 100%; 
            background: #000; 
            border-radius: 4px; 
            display: block;
        }
        
        /* Contenedor del botón para asegurar que siempre sea visible */
        .boton-contenedor {
            width: 100%;
            max-width: 800px;
            display: flex;
            justify-content: center;
            padding: 20px 0 40px 0;
        }

        button { 
            background: #3700b3; 
            color: white; 
            border: none; 
            padding: 12px 24px; 
            font-size: 16px; 
            cursor: pointer; 
            border-radius: 5px;
            width: 100%;
            max-width: 300px;
            transition: background 0.3s;
        }
        
        button:hover { background: #6200ee; }
        button:disabled { background: #333; color: #777; cursor: not-allowed; }
    </style>
</head>
<body>
    <h2>FastMedia Server</h2>
    <div id="contenedor-videos"></div>
    
    <div class="boton-contenedor">
        <button id="btn-cargar" onclick="cargarMas()">Cargar más videos</button>
    </div>

    <script>
        let paginaActual = 1;

        async function cargarMas() {
            const btn = document.getElementById('btn-cargar');
            btn.innerText = "Cargando...";
            btn.disabled = true;

            try {
                const respuesta = await fetch('/api/videos?page=' + paginaActual);
                const datos = await respuesta.json();
                
                if(datos.videos.length === 0) {
                    btn.innerText = "No hay más archivos";
                    return;
                }

                const contenedor = document.getElementById('contenedor-videos');
                datos.videos.forEach(v => {
                    const div = document.createElement('div');
                    div.className = 'video-card';
                    div.innerHTML = "<h3>" + v.nombre + "</h3>" +
                                    "<video controls preload='none'>" +
                                    "<source src='/stream?id=" + v.id + "' type='video/mp4'>" +
                                    "</video>";
                    contenedor.appendChild(div);
                });
                
                paginaActual++;
                btn.innerText = "Cargar más videos";
                btn.disabled = false;
            } catch (err) {
                btn.innerText = "Error al cargar";
            }
        }

        // Cargar inicial
        cargarMas();
    </script>
</body>
</html>
